# Add the real ACP provider behind a managed delegation tool. The denied
# execute permission returns `cancelled` and exercises diagnostic-bearing
# remote-abort parity.
- insert:
    - id: acp-diagnostic-settlement-order
      name: './settlement-order.mjs'
    - id: subagent-acp-diagnostic
      name: '@deepseek-ai/dsh-subagent-acp'
      config:
        providerName: acp-diagnostic
        command: !!js process.execPath
        args:
          # fork/dsh-local (F9): resolve via path.join instead of a file URL — WHATWG keeps
          # the Windows drive letter (`file:///D:/…` → pathname `/D:/…`), which resolves onto
          # the cwd drive as `C:\D:\…` and Cannot-find-module; path.join handles both platforms.
          - !!js "process.getBuiltinModule('node:path').join(process.env.DSH_SNAPSHOT_FILE, '..', '..', '..', '..', 'packages/subagent/subagent-acp/tests/mock-acp-server.ts')"
        permission: reject
        env:
          MOCK_PERMISSION: '1'
          MOCK_TOOL_KIND: execute
    - id: tool-subagent-acp-diagnostic
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: acp-diagnostic
        toolName: subagent_acp
        maxDepth: provider-managed
